<script>
(function () {
  "use strict";

  /*
   * Compatibility shim for old Markdown files written with
   *
   *   \( ... \)
   *   \[ ... \]
   *
   * kramdown may consume the backslashes of those delimiters before
   * MathJax gets to see the page, leaving:
   *
   *   ( ... )
   *   [ ... ]
   *
   * This script heuristically restores those delimiters immediately
   * before MathJax performs its first typesetting pass.
   */

  function isEscaped(text, index) {
    let n = 0;

    for (let i = index - 1; i >= 0 && text[i] === "\\"; i--) {
      n++;
    }

    return n % 2 === 1;
  }


  /*
   * Decide whether the contents of (...) look sufficiently like TeX.
   *
   * This intentionally recognises single variables such as:
   *
   *   (K)
   *   (S)
   *   (n)
   *
   * because these commonly come from \(K\), \(S\), \(n\).
   */
  function looksLikeInlineMath(raw) {
    const s = raw.trim();

    if (!s || s.length > 500 || /\n/.test(s)) {
      return false;
    }

    /* TeX command: \Sigma, \mathcal, \ge, \mathrm, ... */
    if (/\\[A-Za-z]+/.test(s)) {
      return true;
    }

    /* Subscripts / superscripts. */
    if (/[_^]/.test(s) && /[A-Za-z0-9]/.test(s)) {
      return true;
    }

    /* Mathematical relations. */
    if (/[=<>≤≥∈∉⊂⊆⊃⊇→↦≈≠]/.test(s)) {
      return true;
    }

    /* Single variables: (K), (S), (n), ... */
    if (/^[A-Za-z]$/.test(s)) {
      return true;
    }

    /* Tuples such as (K,S), (p,q,r). */
    if (/^[A-Za-z]\s*(?:,\s*[A-Za-z])+$/.test(s)) {
      return true;
    }

    /* Tiny algebraic expressions such as x+y, C*, p/q. */
    if (/^[A-Za-z0-9]+\s*[+*/-]\s*[A-Za-z0-9*]+$/.test(s)) {
      return true;
    }

    /*
     * Function-like expressions, e.g.
     *
     *   f(x)
     *   SL_n(...)
     */
    if (/^[A-Za-z][A-Za-z0-9_^{},\\]*\s*\([^\n]*\)$/.test(s)) {
      return true;
    }

    return false;
  }


  /*
   * Display mathematics gets a slightly stronger test because [...]
   * also occurs naturally in ordinary prose.
   */
  function looksLikeDisplayMath(raw) {
    const s = raw.trim();

    if (!s || s.length > 10000) {
      return false;
    }

    if (/\\[A-Za-z]+/.test(s)) {
      return true;
    }

    if (/[_^]/.test(s) && /[A-Za-z0-9]/.test(s)) {
      return true;
    }

    if (/[=<>≤≥∈∉⊂⊆⊃⊇→↦≈≠]/.test(s)) {
      return true;
    }

    return false;
  }


  /*
   * Restore old
   *
   *   \[ ... \]
   *
   * which kramdown has changed into
   *
   *   [ ... ]
   */
  function restoreLegacyDisplay(text) {

    /*
     * Most display formulas occur as the entire text node / paragraph.
     */
    const whole = text.match(/^(\s*)\[([\s\S]*?)\](\s*)$/);

    if (whole && looksLikeDisplayMath(whole[2])) {
      return (
        whole[1] +
        "\\[" +
        whole[2] +
        "\\]" +
        whole[3]
      );
    }

    /*
     * Also support a TeX-looking [...] expression embedded in a
     * larger text node.
     */
    return text.replace(
      /\[([^\[\]]{1,4000})\]/g,
      function (match, inner, offset, source) {

        /*
         * Do not touch an existing \[ delimiter.
         */
        if (offset > 0 && source[offset - 1] === "\\") {
          return match;
        }

        if (looksLikeDisplayMath(inner)) {
          return "\\[" + inner + "\\]";
        }

        return match;
      }
    );
  }


  /*
   * Find regions that are already valid mathematics.
   *
   * We must not repair parentheses occurring inside:
   *
   *   \( ... \)
   *   \[ ... \]
   *   $ ... $
   *   $$ ... $$
   */
  function protectedMathRanges(text) {
    const ranges = [];

    function addDelimited(open, close) {
      let pos = 0;

      while (pos < text.length) {
        const start = text.indexOf(open, pos);

        if (start < 0) {
          break;
        }

        if (isEscaped(text, start)) {
          pos = start + open.length;
          continue;
        }

        const endStart =
          text.indexOf(close, start + open.length);

        if (endStart < 0) {
          break;
        }

        ranges.push([
          start,
          endStart + close.length
        ]);

        pos = endStart + close.length;
      }
    }

    addDelimited("\\[", "\\]");
    addDelimited("\\(", "\\)");
    addDelimited("$$", "$$");


    /*
     * Protect $...$ as well.
     */
    let start = -1;

    for (let i = 0; i < text.length; i++) {
      if (text[i] !== "$" || isEscaped(text, i)) {
        continue;
      }

      /*
       * $$ belongs to display math and was handled above.
       */
      if (
        (i > 0 && text[i - 1] === "$") ||
        (i + 1 < text.length && text[i + 1] === "$")
      ) {
        continue;
      }

      /*
       * Ignore dollars already inside another protected range.
       */
      if (
        ranges.some(
          r => i >= r[0] && i < r[1]
        )
      ) {
        continue;
      }

      if (start < 0) {
        start = i;
      } else {
        ranges.push([start, i + 1]);
        start = -1;
      }
    }

    return ranges;
  }


  function overlapsProtected(start, end, ranges) {
    return ranges.some(
      r =>
        start < r[1] &&
        end + 1 > r[0]
    );
  }


  /*
   * Restore
   *
   *   \( ... \)
   *
   * after kramdown has changed it into
   *
   *   ( ... )
   */
  function restoreLegacyInline(text) {
    const ranges = protectedMathRanges(text);

    const stack = [];
    const pairs = [];

    /*
     * Find balanced parentheses.
     */
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];

      /*
       * Existing escaped parentheses belong to TeX already.
       */
      if (
        (ch === "(" || ch === ")") &&
        isEscaped(text, i)
      ) {
        continue;
      }

      if (ch === "(") {
        stack.push(i);
      } else if (
        ch === ")" &&
        stack.length
      ) {
        const start = stack.pop();

        pairs.push({
          start: start,
          end: i
        });
      }
    }


    /*
     * Prefer the outermost math-looking pair.
     *
     * Thus
     *
     *   (f(x))
     *
     * becomes one formula rather than separately converting (x).
     */
    pairs.sort(function (a, b) {
      return (
        a.start - b.start ||
        b.end - a.end
      );
    });


    const chosen = [];

    for (const p of pairs) {

      if (
        overlapsProtected(
          p.start,
          p.end,
          ranges
        )
      ) {
        continue;
      }

      /*
       * Do not choose a nested expression if its outer expression
       * has already been selected.
       */
      if (
        chosen.some(
          q =>
            p.start > q.start &&
            p.end < q.end
        )
      ) {
        continue;
      }

      const inner =
        text.slice(
          p.start + 1,
          p.end
        );

      if (looksLikeInlineMath(inner)) {
        chosen.push(p);
      }
    }


    /*
     * Replace from right to left so string indices remain valid.
     */
    chosen.sort(
      function (a, b) {
        return b.start - a.start;
      }
    );

    for (const p of chosen) {
      text =
        text.slice(0, p.start) +
        "\\(" +
        text.slice(
          p.start + 1,
          p.end
        ) +
        "\\)" +
        text.slice(p.end + 1);
    }

    return text;
  }


  /*
   * Walk through the rendered article and repair text nodes.
   */
  function restoreLegacyMathDelimiters(root) {
    if (!root) {
      return;
    }

    const walker =
      document.createTreeWalker(
        root,
        NodeFilter.SHOW_TEXT,
        {
          acceptNode: function (node) {
            const parent =
              node.parentElement;

            if (!parent) {
              return NodeFilter.FILTER_REJECT;
            }

            /*
             * Never alter code, scripts, styles, etc.
             */
            if (
              parent.closest(
                "script, style, textarea, pre, code, noscript, mjx-container"
              )
            ) {
              return NodeFilter.FILTER_REJECT;
            }

            if (
              !node.nodeValue ||
              !node.nodeValue.trim()
            ) {
              return NodeFilter.FILTER_REJECT;
            }

            return NodeFilter.FILTER_ACCEPT;
          }
        }
      );


    /*
     * Collect nodes first, then modify them.
     */
    const nodes = [];

    let node;

    while (
      (node = walker.nextNode())
    ) {
      nodes.push(node);
    }


    for (const textNode of nodes) {
      let text =
        textNode.nodeValue;

      text =
        restoreLegacyDisplay(text);

      text =
        restoreLegacyInline(text);

      if (
        text !== textNode.nodeValue
      ) {
        textNode.nodeValue = text;
      }
    }
  }


  /*
   * MathJax configuration.
   */
  window.MathJax = {

    tex: {
      inlineMath: [
        ["$", "$"],
        ["\\(", "\\)"]
      ],

      displayMath: [
        ["$$", "$$"],
        ["\\[", "\\]"]
      ],

      processEscapes: true
    },


    options: {
      skipHtmlTags: [
        "script",
        "noscript",
        "style",
        "textarea",
        "pre",
        "code"
      ]
    },


    /*
     * Critical part:
     *
     * repair the HTML immediately before MathJax's initial typeset.
     */
    startup: {
      pageReady: function () {

        /*
         * jekyll-theme-minimal places the Markdown content in <section>.
         * Restricting the repair to that section avoids touching the
         * sidebar / site metadata unnecessarily.
         */
        restoreLegacyMathDelimiters(
          document.querySelector("section") ||
          document.body
        );

        return MathJax.startup.defaultPageReady();
      }
    }
  };

})();
</script>


<script
  id="MathJax-script"
  defer
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
</script>

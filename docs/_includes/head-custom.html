<script>
(function () {
  "use strict";

  /*
   * Compatibility layer for old LaTeX-style Markdown:
   *
   *   \( ... \)
   *   \[ ... \]
   *
   * Jekyll/kramdown may:
   *
   *   1. remove the '\' from \( \) and \[ \]
   *   2. interpret TeX underscores as Markdown emphasis:
   *
   *        \mathrm{SL}_n(\mathcal O_{K,\Sigma})
   *
   *      may become DOM roughly like
   *
   *        \mathrm{SL}<em>n(\mathcal O</em>{K,\Sigma})
   *
   * We reconstruct those pieces BEFORE MathJax starts.
   */


  /* ------------------------------------------------------------
   * Helpers
   * ------------------------------------------------------------ */

  function isEscaped(text, index) {
    let count = 0;

    for (
      let i = index - 1;
      i >= 0 && text[i] === "\\";
      i--
    ) {
      count++;
    }

    return count % 2 === 1;
  }


  function hasTexCommand(text) {
    return /\\[A-Za-z]+/.test(text);
  }


  function looksLikeInlineMath(raw) {
    const s = raw.trim();

    if (!s || s.length > 2000 || /\n{2,}/.test(s)) {
      return false;
    }

    /* \Sigma, \mathcal, \mathrm, \ge, ... */
    if (hasTexCommand(s)) {
      return true;
    }

    /* subscripts / superscripts */
    if (/[_^]/.test(s) && /[A-Za-z0-9]/.test(s)) {
      return true;
    }

    /* mathematical relations/operators */
    if (
      /[=<>≤≥∈∉⊂⊆⊃⊇→↦≈≠±×÷∞]/.test(s)
    ) {
      return true;
    }

    /* single mathematical variables: (K), (S), (n), ... */
    if (/^[A-Za-z]$/.test(s)) {
      return true;
    }

    /* Greek unicode variables */
    if (/^[Α-Ωα-ωΓΣΠΔΛΘΩ]+$/.test(s)) {
      return true;
    }

    /* tuples: (K,S), (p,q,r) */
    if (
      /^[A-Za-z]\s*(?:,\s*[A-Za-z])+$/.test(s)
    ) {
      return true;
    }

    /* short algebraic expressions */
    if (
      /^[A-Za-z0-9]+\s*[+\-*\/]\s*[A-Za-z0-9*]+$/.test(s)
    ) {
      return true;
    }

    return false;
  }


  function looksLikeDisplayMath(raw) {
    const s = raw.trim();

    if (!s || s.length > 20000) {
      return false;
    }

    if (hasTexCommand(s)) {
      return true;
    }

    if (/[_^]/.test(s)) {
      return true;
    }

    if (
      /[=<>≤≥∈∉⊂⊆⊃⊇→↦≈≠±×÷∞]/.test(s)
    ) {
      return true;
    }

    return false;
  }



  /* ------------------------------------------------------------
   * Recover underscores swallowed by Markdown emphasis
   * ------------------------------------------------------------ */

  /*
   * Decide whether an <em> node is probably caused by TeX
   * underscores rather than intentional Markdown italics.
   */
  function texishEmphasis(em) {
    const text = em.textContent || "";

    /*
     * Strongest clue:
     *
     *   <em>n(\mathcal O</em>
     *
     * contains a TeX command.
     */
    if (hasTexCommand(text)) {
      return true;
    }


    const prev =
      em.previousSibling
        ? (em.previousSibling.textContent || "")
        : "";

    const next =
      em.nextSibling
        ? (em.nextSibling.textContent || "")
        : "";


    /*
     * Nearby TeX command.
     */
    const neighborhood =
      prev.slice(-60) +
      text +
      next.slice(0, 60);

    if (hasTexCommand(neighborhood)) {
      return true;
    }


    /*
     * Typical fragments created by:
     *
     *   _n
     *   _{K,\Sigma}
     *   ^*_{\max}
     */
    if (
      /[A-Za-z0-9}\])]\s*$/.test(prev) &&
      (
        /^[A-Za-z0-9{\\]/.test(text) ||
        /^[{(\\]/.test(next)
      )
    ) {
      return true;
    }

    return false;
  }


  /*
   * Reconstruct a Markdown-ish / TeX-ish string from a DOM block.
   *
   * Important:
   * TeX-caused <em>...</em> becomes _..._ again.
   */
  function reconstructText(node, state) {

    if (node.nodeType === Node.TEXT_NODE) {
      return node.nodeValue || "";
    }


    if (node.nodeType !== Node.ELEMENT_NODE) {
      return "";
    }


    const tag =
      node.tagName.toLowerCase();


    if (
      tag === "script" ||
      tag === "style" ||
      tag === "noscript" ||
      tag === "code" ||
      tag === "pre" ||
      tag === "mjx-container"
    ) {
      state.unsafe = true;
      return node.textContent || "";
    }


    if (tag === "br") {
      return "\n";
    }


    let body = "";

    for (const child of node.childNodes) {
      body += reconstructText(child, state);
    }


    if (tag === "em" || tag === "i") {

      if (texishEmphasis(node)) {
        state.recoveredUnderscore = true;
        return "_" + body + "_";
      }

      /*
       * This looks like genuine prose italics.
       * Don't flatten this paragraph, because we would destroy
       * intentional formatting.
       */
      state.unsafe = true;

      return body;
    }


    if (
      tag === "strong" ||
      tag === "b" ||
      tag === "a" ||
      tag === "img" ||
      tag === "button"
    ) {
      state.unsafe = true;
    }


    return body;
  }



  /* ------------------------------------------------------------
   * Protect already-valid math
   * ------------------------------------------------------------ */

  function protectedMathRanges(text) {
    const ranges = [];


    function addDelimited(open, close) {
      let pos = 0;

      while (pos < text.length) {

        const start =
          text.indexOf(open, pos);

        if (start < 0) {
          break;
        }


        const end =
          text.indexOf(
            close,
            start + open.length
          );

        if (end < 0) {
          break;
        }


        ranges.push([
          start,
          end + close.length
        ]);

        pos =
          end + close.length;
      }
    }


    addDelimited("\\(", "\\)");
    addDelimited("\\[", "\\]");
    addDelimited("$$", "$$");


    /*
     * Protect $ ... $
     */
    let dollarStart = -1;

    for (
      let i = 0;
      i < text.length;
      i++
    ) {

      if (
        text[i] !== "$" ||
        isEscaped(text, i)
      ) {
        continue;
      }


      if (
        text[i - 1] === "$" ||
        text[i + 1] === "$"
      ) {
        continue;
      }


      const alreadyProtected =
        ranges.some(
          r =>
            i >= r[0] &&
            i < r[1]
        );

      if (alreadyProtected) {
        continue;
      }


      if (dollarStart < 0) {
        dollarStart = i;
      } else {
        ranges.push([
          dollarStart,
          i + 1
        ]);

        dollarStart = -1;
      }
    }


    return ranges;
  }


  function overlapsProtected(
    start,
    end,
    ranges
  ) {
    return ranges.some(
      r =>
        start < r[1] &&
        end + 1 > r[0]
    );
  }



  /* ------------------------------------------------------------
   * Restore display math: [ ... ] -> \[ ... \]
   * ------------------------------------------------------------ */

  function restoreLegacyDisplay(text) {

    /*
     * Formula occupies the whole paragraph.
     */
    const whole =
      text.match(
        /^(\s*)\[([\s\S]*?)\](\s*)$/
      );


    if (
      whole &&
      looksLikeDisplayMath(whole[2])
    ) {
      return (
        whole[1] +
        "\\[" +
        whole[2] +
        "\\]" +
        whole[3]
      );
    }


    /*
     * Embedded [...] that clearly looks like TeX.
     */
    return text.replace(
      /\[([^\[\]]{1,10000})\]/g,

      function (
        match,
        inner,
        offset,
        source
      ) {

        if (
          offset > 0 &&
          source[offset - 1] === "\\"
        ) {
          return match;
        }


        if (
          looksLikeDisplayMath(inner)
        ) {
          return (
            "\\[" +
            inner +
            "\\]"
          );
        }


        return match;
      }
    );
  }



  /* ------------------------------------------------------------
   * Restore inline math: (...) -> \( ... \)
   * ------------------------------------------------------------ */

  function restoreLegacyInline(text) {

    const protectedRanges =
      protectedMathRanges(text);

    const stack = [];
    const pairs = [];


    /*
     * Collect balanced parentheses.
     */
    for (
      let i = 0;
      i < text.length;
      i++
    ) {

      const ch = text[i];


      if (
        (ch === "(" || ch === ")") &&
        isEscaped(text, i)
      ) {
        continue;
      }


      if (ch === "(") {

        stack.push(i);

      } else if (
        ch === ")" &&
        stack.length
      ) {

        const start =
          stack.pop();

        pairs.push({
          start: start,
          end: i
        });
      }
    }


    /*
     * Process outer pairs first.
     */
    pairs.sort(
      function (a, b) {

        return (
          a.start - b.start ||
          b.end - a.end
        );
      }
    );


    const chosen = [];


    for (const pair of pairs) {

      if (
        overlapsProtected(
          pair.start,
          pair.end,
          protectedRanges
        )
      ) {
        continue;
      }


      /*
       * If an enclosing formula has already been chosen,
       * don't independently typeset its inner parentheses.
       */
      if (
        chosen.some(
          outer =>
            pair.start > outer.start &&
            pair.end < outer.end
        )
      ) {
        continue;
      }


      const inner =
        text.slice(
          pair.start + 1,
          pair.end
        );


      if (
        looksLikeInlineMath(inner)
      ) {
        chosen.push(pair);
      }
    }


    /*
     * Right-to-left replacement keeps offsets valid.
     */
    chosen.sort(
      function (a, b) {
        return b.start - a.start;
      }
    );


    for (const pair of chosen) {

      text =
        text.slice(
          0,
          pair.start
        ) +

        "\\(" +

        text.slice(
          pair.start + 1,
          pair.end
        ) +

        "\\)" +

        text.slice(
          pair.end + 1
        );
    }


    return text;
  }



  /* ------------------------------------------------------------
   * Repair one complete paragraph/block
   * ------------------------------------------------------------ */

  function repairBlock(element) {

    /*
     * Don't interfere with already-generated MathJax.
     */
    if (
      element.closest(
        "pre, code, script, style, mjx-container"
      )
    ) {
      return;
    }


    const state = {
      unsafe: false,
      recoveredUnderscore: false
    };


    let reconstructed =
      reconstructText(
        element,
        state
      );


    /*
     * If there's genuine HTML formatting / a link etc.,
     * leave it alone unless we specifically recovered a
     * TeX-created underscore.
     */
    if (
      state.unsafe &&
      !state.recoveredUnderscore
    ) {
      return;
    }


    const originalPlain =
      element.textContent || "";


    let repaired =
      reconstructed;


    /*
     * Important order:
     *
     * 1. recover underscores via DOM reconstruction
     * 2. recover display delimiters
     * 3. recover inline delimiters
     */
    repaired =
      restoreLegacyDisplay(
        repaired
      );


    repaired =
      restoreLegacyInline(
        repaired
      );


    /*
     * Only flatten this element if an actual repair occurred.
     */
    if (
      repaired !== originalPlain ||
      state.recoveredUnderscore
    ) {
      element.textContent =
        repaired;
    }
  }



  /* ------------------------------------------------------------
   * Repair the article
   * ------------------------------------------------------------ */

  function restoreLegacyMath(root) {

    if (!root) {
      return;
    }


    /*
     * Work on whole blocks rather than individual text nodes.
     *
     * This is the major change from v1:
     * malformed TeX may have been split across <em> elements by
     * kramdown, so individual text nodes don't contain enough
     * information to reconstruct the formula.
     */
    const blocks =
      root.querySelectorAll(
        "p, li, td, th"
      );


    for (const block of blocks) {
      repairBlock(block);
    }
  }



  /* ------------------------------------------------------------
   * MathJax configuration
   * ------------------------------------------------------------ */

  window.MathJax = {

    tex: {

      inlineMath: [
        ["$", "$"],
        ["\\(", "\\)"]
      ],

      displayMath: [
        ["$$", "$$"],
        ["\\[", "\\]"]
      ],

      processEscapes: true
    },


    options: {

      skipHtmlTags: [
        "script",
        "noscript",
        "style",
        "textarea",
        "pre",
        "code"
      ]
    },


    startup: {

      pageReady: function () {

        const root =
          document.querySelector(
            "section"
          ) ||
          document.body;


        /*
         * Repair malformed legacy TeX before MathJax scans the DOM.
         */
        restoreLegacyMath(root);


        return (
          MathJax.startup
            .defaultPageReady()
        );
      }
    }
  };

})();
</script>


<script
  id="MathJax-script"
  defer
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
</script>
